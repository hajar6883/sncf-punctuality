version: 2

models:
  - name: stg_tgv_route_monthly
    description: TGV punctuality by route and month, typed and cleaned (rules in docs/data_model.md).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [month_start, service, origin_station, destination_station]
    columns:
      - name: month_start
        tests: [not_null]
      - name: service
        tests:
          - accepted_values:
              arguments:
                values: [National, International]
      - name: origin_station
        tests: [not_null]
      - name: destination_station
        tests: [not_null]
      - name: trains_ran
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: avg_delay_all_arrival
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -15
