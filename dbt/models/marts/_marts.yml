version: 2

models:
  - name: fact_punctuality
    description: TGV punctuality, one row per month x route (route includes service). Additive measures only.
    columns:
      - name: punctuality_key
        tests: [unique, not_null]
      - name: month_start
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: month_start
      - name: route_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_route')
                field: route_key
      - name: trains_planned
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: trains_on_time
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: fact_delay_cause
    description: Delay-cause mix per fact_punctuality row. est_late_trains is an approximation.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [punctuality_key, cause_key]
    columns:
      - name: punctuality_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_punctuality')
                field: punctuality_key
      - name: cause_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_delay_cause')
                field: cause_key
      - name: cause_share_pct
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100

  - name: dim_route
    description: One row per service x origin x destination.
    columns:
      - name: route_key
        tests: [unique, not_null]
      - name: service
        tests:
          - accepted_values:
              arguments:
                values: [National, International]

  - name: dim_date
    description: One row per month, no gaps.
    columns:
      - name: month_start
        tests: [unique, not_null]

  - name: dim_delay_cause
    description: The six SNCF delay-cause categories.
    columns:
      - name: cause_key
        tests: [unique, not_null]
